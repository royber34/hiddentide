# Netlify config for Hidden Tide (hiddentide.com)
# The repo ROOT is this folder (the website), so publish = "."
# It is a static site: no build step, no dependencies.

[build]
  publish = "."
  command = ""

# Sensible security headers (optional but nice)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# roster.json must never be cached hard, so the crew list updates as soon as it changes
[[headers]]
  for = "/roster.json"
  [headers.values]
    Cache-Control = "no-cache"

# The generated blog: proxied from the Content Engine build.
# status = 200 makes this a transparent proxy (the reader stays on
# hiddentide.com); force = true makes it authoritative for /blog/*.
[[redirects]]
  from = "/blog/*"
  to = "https://hiddentide-astro.vercel.app/blog/:splat"
  status = 200
  force = true
