# Netlify config for Hidden Tide (hiddentide.com)
# The repo ROOT is this folder (the website), so publish = "."
# It is a static site: no build step, no dependencies.

[build]
  publish = "."
  command = ""

# Sensible security headers (optional but nice)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# roster.json must never be cached hard, so the crew list updates as soon as it changes
[[headers]]
  for = "/roster.json"
  [headers.values]
    Cache-Control = "no-cache"
